name: Build TuneX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Unzip newest project zip
        run: |
          best=""; bt=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -gt "$bt" ]; then bt=$t; best="$f"; fi
          done
          echo "Using $best"
          unzip -q "$best"
      - name: Build APK
        working-directory: TuneX
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Copy APK
        run: cp TuneX/app/build/outputs/apk/debug/app-debug.apk TuneX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TuneX-apk
          path: TuneX.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TuneX v${{ github.run_number }}
          files: TuneX.apk
